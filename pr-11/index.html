    <style id="lockloot-mobile-fit">
      :root {
        color-scheme: dark;
        background: #000;
      }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000;
      }
      body {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
      #canvasArea {
        position: fixed !important;
        inset: 0 !important;
        box-sizing: border-box !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        padding-top: env(safe-area-inset-top, 0px) !important;
        padding-right: env(safe-area-inset-right, 0px) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
        padding-left: env(safe-area-inset-left, 0px) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: hidden !important;
      }
      #canvasArea canvas, body > canvas {
        display: block !important;
        flex: 0 0 auto !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
      }
      #lockloot-orientation {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        box-sizing: border-box;
        padding: calc(24px + env(safe-area-inset-top, 0px))
          calc(24px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px))
          calc(24px + env(safe-area-inset-left, 0px));
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        font: 600 1.1rem/1.4 system-ui, sans-serif;
        color: #fff4ce;
        background: #000;
      }
      #lockloot-orientation[data-lockloot-show="true"] {
        display: flex;
      }
    </style>
    <script id="lockloot-mobile-fit-script">
      (() => {
        const gameWidth = 720;
        const gameHeight = 1280;
        const landscapeGame = gameWidth > gameHeight;
        let observedArea = null;
        let resizeObserver = null;

        const fit = () => {
          const canvasArea = document.getElementById('canvasArea');
          const area = canvasArea || document.body;
          const canvas = (canvasArea && canvasArea.querySelector('canvas')) || document.querySelector('body > canvas');
          const overlay = document.getElementById('lockloot-orientation');
          if (!area || !canvas || !overlay) {
            if (document.body) document.body.dataset.locklootMobileLayout = 'pending';
            return;
          }

          if (area !== observedArea && typeof ResizeObserver === 'function') {
            if (resizeObserver) resizeObserver.disconnect();
            observedArea = area;
            resizeObserver = new ResizeObserver(() => requestAnimationFrame(fit));
            resizeObserver.observe(area);
          }

          const viewport = window.visualViewport;
          const viewportWidth = Math.max(1, viewport ? viewport.width : window.innerWidth);
          const viewportHeight = Math.max(1, viewport ? viewport.height : window.innerHeight);
          const computed = getComputedStyle(area);
          const horizontalPadding = parseFloat(computed.paddingLeft || '0') + parseFloat(computed.paddingRight || '0');
          const verticalPadding = parseFloat(computed.paddingTop || '0') + parseFloat(computed.paddingBottom || '0');
          const availableWidth = Math.max(1, viewportWidth - horizontalPadding);
          const availableHeight = Math.max(1, viewportHeight - verticalPadding);
          const scale = Math.min(availableWidth / gameWidth, availableHeight / gameHeight);
          const fittedWidth = Math.max(1, Math.floor(gameWidth * scale * 1000) / 1000);
          const fittedHeight = Math.max(1, Math.floor(gameHeight * scale * 1000) / 1000);

          canvas.style.setProperty('width', fittedWidth + 'px', 'important');
          canvas.style.setProperty('height', fittedHeight + 'px', 'important');
          if (!canvasArea) {
            const fittedLeft = horizontalPadding / 2 + (availableWidth - fittedWidth) / 2;
            const fittedTop = verticalPadding / 2 + (availableHeight - fittedHeight) / 2;
            canvas.style.setProperty('position', 'fixed', 'important');
            canvas.style.setProperty('left', fittedLeft + 'px', 'important');
            canvas.style.setProperty('top', fittedTop + 'px', 'important');
          }

          const rotate = landscapeGame && viewportHeight > viewportWidth;
          overlay.dataset.locklootShow = String(rotate);
          overlay.setAttribute('aria-hidden', String(!rotate));
          canvas.style.setProperty('visibility', rotate ? 'hidden' : 'visible', 'important');
          canvas.style.setProperty('pointer-events', rotate ? 'none' : 'auto', 'important');

          const tolerance = 1.5;
          const fits = fittedWidth <= availableWidth + tolerance && fittedHeight <= availableHeight + tolerance;
          document.body.dataset.locklootMobileLayout = rotate ? 'rotate' : 'ready';
          document.body.dataset.locklootCanvasFits = String(fits);
          document.body.dataset.locklootRotateVisible = String(rotate);
          document.body.dataset.locklootGameSize = gameWidth + 'x' + gameHeight;
          document.body.dataset.locklootFittedSize = fittedWidth + 'x' + fittedHeight;
          document.body.dataset.locklootViewport = Math.round(viewportWidth) + 'x' + Math.round(viewportHeight);
        };

        const scheduleFit = () => requestAnimationFrame(() => requestAnimationFrame(fit));
        window.addEventListener('resize', scheduleFit, { passive: true });
        window.addEventListener('orientationchange', scheduleFit, { passive: true });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleFit, { passive: true });
        document.addEventListener('DOMContentLoaded', scheduleFit, { once: true });
        const mutationObserver = new MutationObserver(scheduleFit);
        mutationObserver.observe(document.documentElement, { childList: true, subtree: true });
        let attempts = 0;
        const startupTimer = setInterval(() => {
          fit();
          attempts += 1;
          if (attempts >= 40 && document.body?.dataset.locklootMobileLayout !== 'pending') {
            clearInterval(startupTimer);
          }
        }, 250);
      })();
    </script>
</head>
<body>
  <div id="lockloot-orientation" role="status" aria-live="polite" aria-hidden="true">Bitte Gerät drehen</div>

    
	<script>

    (function() {
        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, {});

        //Create a renderer
        game.getRenderer().createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
